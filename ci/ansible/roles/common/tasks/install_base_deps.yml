- block:
  - name: Install base dependencies
    apt:
      name: "{{ item }}"
      state: present
      update_cache: yes
    loop:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - python3
      - python3-venv
      - python3-pip
      - git
      - rsync

  # Install docker
  - name: Add Docker GPG key
    apt_key:
      url: https://download.docker.com/linux/ubuntu/gpg
      state: present

  - name: Add Docker repository
    apt_repository:
      repo: deb https://download.docker.com/linux/ubuntu focal stable
      state: present
      filename: docker

  - name: Update apt and install docker-ce
    apt:
      name: docker-ce
      state: present
      update_cache: yes

  - name: Ensure Docker service is started
    service:
      name: docker
      state: started
      enabled: yes

  - name: Add user to Docker group
    user:
      name: "{{ ansible_user }}"
      groups: docker
      append: yes